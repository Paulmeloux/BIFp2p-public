name: Static Python checks
on:
  push:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python files without executing the bot
        run: python -m compileall -q .
      - name: Check excluded modules and references
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          files = list(Path('.').glob('*.py'))
          assert not any(p.name == 'books.py' or p.name == 'bifwallet.py' or p.name.startswith('wallet_') for p in files)
          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  modules = ([node.module or ''] if isinstance(node, ast.ImportFrom)
                             else [a.name for a in node.names] if isinstance(node, ast.Import) else [])
                  assert not any(m.split('.')[0] in ('books', 'bifwallet') or
                                 m.split('.')[0].startswith('wallet_') for m in modules), path
          print(f'Checked {len(files)} Python modules')
          PY

